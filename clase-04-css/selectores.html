<!doctype html>
<html lang="es">
  <!-- <html lang="es-ar"> -->
  <!-- <html lang="es-es"> -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selectores++ pseudoclases formularios</title>
    <link rel="stylesheet" href="selectores.css" />
  </head>
  <body>
    <!-- Necesito estar en un formulario para las validaciones-->
    <form>
      <div class="a b c">
        <label for="firstName">Nombre: </label>
        <input
          type="text"
          name="firstName"
          id="firstName"
          required
          maxlength="20"
          minlength="2"
          autocomplete="given-name"
        />
      </div>
      <div class="a b c">
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" required />
      </div>
      <div class="a b c d">
        <label for="age">Edad: </label>
        <input type="number" name="age" id="age" min="18" max="99" />
      </div>
      <div class="a c d">
        <label for="stat">Calificación: </label>
        <input type="range" name="stat" id="stat" min="0" max="10" step="2" />
      </div>
      <div>
        <label for="password">Contraseña: </label>
        <input
          type="password"
          name="new-password"
          id="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>
      <!-- Necesito el botón que envía el formulario (submit)-->
      <button type="submit">Enviar</button>
    </form>
    <div style="height: 200px"></div>
  </body>
</html>
