<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="profesores.css" />

    <title>Profesores</title>
  </head>
  <body>
    <h1>Profesores</h1>
    <nav>
      <button>
        <a href="../index.html">Inicio</a>
      </button>
      <button>
        <a href="./index.html">Profesores</a>
      </button>
      <button>
        <a href="../cursos/index.html">Cursos</a>
      </button>
    </nav>

    <hr />

    <div class="row">
      <section class="col-6">
        <h2>Crear un profesor</h2>

        <form id="form">
          <div>
            <label for="nombre">Nombre: </label>
            <input class="form-control" id="nombre" />
          </div>
          <div>
            <label for="apellido">Apellido: </label>
            <input class="form-control" id="apellido" />
          </div>

          <button type="submit" class="mt-3 btn btn-outline-dark">
            Crear Profesor
          </button>
          <p id="resultado"></p>
        </form>
      </section>

      <section class="col-6">
        <h2>Traer profesor</h2>
        <form>
          <div>
            <label for="id">Apellido: </label>
            <input class="form-control" id="id" id="enviar" />
          </div>

          <button type="submit" class="mt-3 btn btn-outline-dark">
            Buscar
          </button>
        </form>
      </section>
    </div>

    <section>
      <table class="table text-center">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cantidad de cursos</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <script src="profesores.js"></script>
  </body>
</html>
