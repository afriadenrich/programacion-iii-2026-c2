    <link rel="stylesheet" href="../global.css" />

    <title>Cursos</title>
  </head>
  <body>
    <h1>Cursos</h1>
    <nav>
      <button>
        <a href="../index.html">Inicio</a>

      <button>

      <button>

      <section>
        <h2>Crear un Curso</h2>

        <form
          id="form"
          action="http://localhost:3000/cursos"
          method="post"
          enctype="text/plain" // NO SOPORTA JSON
        >
          <div>
            <label for="nombre">Nombre: </label>
            <input class="form-control" id="nombre" name="nombre" />
          </div>
          <div>
            <label for="cuatrimestre">Apellido: </label>
            <input class="form-control" id="cuatrimestre" name="cuatrimestre" />
          </div>
          <div>
            <label for="idProfesor">Apellido: </label>
            <input class="form-control" id="idProfesor" name="idProfesor" />
          </div>

          <button type="submit" class="mt-3 btn btn-outline-dark">
            Crear Profesor
          </button>
          <p id="resultado"></p>
        </form>

        <form action="http://localhost:3000/cursos" method="get">
          <button type="submit">Mostrar todos</button>
        </form>
      </section>
    </nav>
  </body>
